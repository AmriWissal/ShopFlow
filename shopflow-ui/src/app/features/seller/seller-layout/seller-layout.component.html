<div class="min-h-screen bg-slate-50 flex">
  <!-- Sidebar -->
  <aside class="w-72 bg-green-50/30 border-r border-green-100/50 hidden lg:flex flex-col sticky top-0 h-screen transition-all duration-300 shadow-sm">
    <div class="p-8 border-b border-slate-100">
      <a routerLink="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 bg-green-500 rounded-xl flex items-center justify-center shadow-lg shadow-green-200 group-hover:rotate-12 transition-transform">
          <mat-icon class="text-white">storefront</mat-icon>
        </div>
        <span class="text-xl font-black text-slate-900">Seller<span class="text-green-500">Hub</span></span>
      </a>
    </div>

    <nav class="flex-grow p-6 space-y-2">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] px-3 mb-4">Menu Principal</p>
      
      <a routerLink="/seller/dashboard" routerLinkActive="bg-green-50 text-green-600 border-green-500" 
         class="flex items-center gap-3 px-4 py-3.5 text-sm font-bold text-slate-600 rounded-xl border-l-4 border-transparent hover:bg-slate-50 transition-all group">
        <mat-icon class="text-slate-400 group-hover:text-green-500">dashboard</mat-icon>
        Tableau de bord
      </a>
      
      <a routerLink="/seller/products" routerLinkActive="bg-green-50 text-green-600 border-green-500" 
         class="flex items-center gap-3 px-4 py-3.5 text-sm font-bold text-slate-600 rounded-xl border-l-4 border-transparent hover:bg-slate-50 transition-all group">
        <mat-icon class="text-slate-400 group-hover:text-green-500">inventory_2</mat-icon>
        Mes Produits
      </a>

      <a routerLink="/seller/categories" routerLinkActive="bg-green-50 text-green-600 border-green-500" 
         class="flex items-center gap-3 px-4 py-3.5 text-sm font-bold text-slate-600 rounded-xl border-l-4 border-transparent hover:bg-slate-50 transition-all group">
        <mat-icon class="text-slate-400 group-hover:text-green-500">category</mat-icon>
        Catégories
      </a>

      <a routerLink="/seller/orders" routerLinkActive="bg-green-50 text-green-600 border-green-500" 
         class="flex items-center gap-3 px-4 py-3.5 text-sm font-bold text-slate-600 rounded-xl border-l-4 border-transparent hover:bg-slate-50 transition-all group">
        <mat-icon class="text-slate-400 group-hover:text-green-500">shopping_cart</mat-icon>
        Commandes
      </a>

      <div class="pt-8">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] px-3 mb-4">Paramètres</p>
        <a routerLink="/profile" class="flex items-center gap-3 px-4 py-3.5 text-sm font-bold text-slate-600 rounded-xl border-l-4 border-transparent hover:bg-slate-50 transition-all group">
          <mat-icon class="text-slate-400 group-hover:text-green-500">person</mat-icon>
          Mon Profil
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-grow overflow-y-auto">
    <header class="lg:hidden bg-white border-b border-slate-200 p-4 flex justify-between items-center">
      <a routerLink="/" class="text-xl font-bold text-green-600">SellerHub</a>
      <button (click)="toggleMobileMenu()" class="p-2 text-slate-600">
        <mat-icon>{{ mobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
      </button>
    </header>

    <div *ngIf="mobileMenuOpen" class="lg:hidden bg-white border-b border-slate-100 p-4 space-y-2">
      <a routerLink="/seller/dashboard" (click)="closeMobileMenu()" class="block px-4 py-3 rounded-xl font-bold text-slate-700 hover:bg-slate-50">Tableau de bord</a>
      <a routerLink="/seller/products" (click)="closeMobileMenu()" class="block px-4 py-3 rounded-xl font-bold text-slate-700 hover:bg-slate-50">Mes produits</a>
      <a routerLink="/seller/categories" (click)="closeMobileMenu()" class="block px-4 py-3 rounded-xl font-bold text-slate-700 hover:bg-slate-50">Categories</a>
      <a routerLink="/seller/orders" (click)="closeMobileMenu()" class="block px-4 py-3 rounded-xl font-bold text-slate-700 hover:bg-slate-50">Commandes</a>
      <a routerLink="/profile" (click)="closeMobileMenu()" class="block px-4 py-3 rounded-xl font-bold text-slate-700 hover:bg-slate-50">Mon profil</a>
    </div>

    <div class="p-6 lg:p-10">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
