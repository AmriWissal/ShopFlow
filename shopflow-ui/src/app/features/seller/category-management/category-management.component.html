<div>
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
    <div>
      <h1 class="text-3xl font-bold text-slate-900">Catégories</h1>
      <p class="text-slate-500 mt-2">Consultez les catégories disponibles pour vos produits.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let cat of categories" 
         class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition-all group">
      <div class="flex justify-between items-start mb-6">
        <div class="w-12 h-12 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center group-hover:bg-green-500 group-hover:text-white transition-colors">
          <mat-icon>category</mat-icon>
        </div>
      </div>
      <h3 class="text-xl font-bold text-slate-900">{{ cat.name }}</h3>
      <p class="text-sm text-slate-500 mt-2 leading-relaxed">{{ cat.description }}</p>
    </div>
  </div>
</div>
