<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-24 relative overflow-hidden">
  <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-green-500/5 rounded-full blur-[100px] -translate-y-1/2 translate-x-1/2"></div>
  <div class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-red-500/5 rounded-full blur-[100px] translate-y-1/2 -translate-x-1/2"></div>

  <div class="max-w-md w-full relative z-10">
    <div class="text-center mb-12">
      <a routerLink="/" class="inline-flex items-center gap-2 group mb-10">
        <div class="w-12 h-12 bg-green-500 rounded-2xl flex items-center justify-center shadow-lg shadow-green-200 group-hover:scale-110 transition-transform duration-300">
          <mat-icon class="text-white">shopping_bag</mat-icon>
        </div>
        <span class="text-3xl font-black text-slate-900 tracking-tight">Shop<span class="text-green-500">Flow</span></span>
      </a>
      <h2 class="text-4xl font-black text-slate-900 tracking-tight">Créer votre compte</h2>
      <p class="mt-4 text-slate-500 font-medium">Rejoignez notre communauté de terroir en Tunisie</p>
    </div>

    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl shadow-slate-200/50 border border-slate-100">
      <!-- Role Selector -->
      <div class="flex p-1.5 bg-slate-50 rounded-2xl border border-slate-100 mb-10 relative">
        <div class="absolute inset-y-1.5 w-[calc(50%-6px)] transition-all duration-500 ease-out bg-green-500 rounded-xl shadow-xl shadow-green-100"
             [style.left]="registerForm.get('role')?.value === 'CUSTOMER' ? '6px' : '50%'">
        </div>
        
        <button type="button" (click)="setRole('CUSTOMER')"
                class="relative flex-1 flex items-center justify-center gap-3 py-3.5 text-xs font-black uppercase tracking-widest transition-colors duration-500 z-10"
                [class.text-white]="registerForm.get('role')?.value === 'CUSTOMER'"
                [class.text-slate-400]="registerForm.get('role')?.value !== 'CUSTOMER'">
          <mat-icon class="text-lg">person</mat-icon>
          Acheteur
        </button>
        
        <button type="button" (click)="setRole('SELLER')"
                class="relative flex-1 flex items-center justify-center gap-3 py-3.5 text-xs font-black uppercase tracking-widest transition-colors duration-500 z-10"
                [class.text-white]="registerForm.get('role')?.value === 'SELLER'"
                [class.text-slate-400]="registerForm.get('role')?.value !== 'SELLER'">
          <mat-icon class="text-lg">storefront</mat-icon>
          Vendeur
        </button>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Prénom</label>
            <input type="text" formControlName="firstName" placeholder="Prénom" 
                   class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white transition-all font-medium">
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Nom</label>
            <input type="text" formControlName="lastName" placeholder="Nom" 
                   class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white transition-all font-medium">
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Adresse Email</label>
          <div class="relative group">
            <input type="email" formControlName="email" placeholder="exemple@mail.com" 
                   class="w-full pl-14 pr-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white transition-all font-medium">
            <mat-icon class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-green-500 transition-colors">email</mat-icon>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Mot de passe</label>
          <div class="relative group">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••" 
                   class="w-full pl-14 pr-14 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white transition-all font-medium">
            <mat-icon class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-green-500 transition-colors">lock</mat-icon>
            <button type="button" (click)="showPassword = !showPassword" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-600 transition-colors">
              <mat-icon class="text-xl">{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>

        <div class="flex items-start gap-4 py-4">
          <input type="checkbox" id="terms" class="mt-1 w-5 h-5 rounded-lg accent-green-500 cursor-pointer">
          <label for="terms" class="text-[11px] text-slate-500 font-medium leading-relaxed">
            J'accepte les <a href="#" class="font-black text-green-600 hover:underline">Conditions d'utilisation</a> et la 
            <a href="#" class="font-black text-green-600 hover:underline">Politique de confidentialité</a>
          </label>
        </div>

        <button type="submit" [disabled]="registerForm.invalid || loading" 
                class="w-full py-5 bg-green-500 text-white font-black rounded-[2rem] shadow-2xl shadow-green-100 hover:bg-green-600 hover:-translate-y-1 disabled:opacity-30 disabled:translate-y-0 transition-all text-xs uppercase tracking-[0.2em]">
          <span *ngIf="!loading">Créer mon compte</span>
          <span *ngIf="loading" class="flex items-center justify-center gap-3">
            <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            Création...
          </span>
        </button>
      </form>

      <div class="mt-10 pt-10 border-t border-slate-50 text-center">
        <p class="text-sm text-slate-500 font-medium">
          Vous avez déjà un compte ? 
          <a routerLink="/auth/login" class="font-black text-green-600 hover:text-green-700 ml-2 uppercase tracking-widest text-[10px]">Se connecter</a>
        </p>
      </div>
    </div>
  </div>
</div>
