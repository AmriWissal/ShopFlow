<div>
  <div class="mb-10">
    <h1 class="text-3xl font-black text-slate-900 tracking-tight">Gestion des Commandes</h1>
    <p class="text-slate-500 mt-2 font-medium">Suivez et mettez à jour les commandes clients.</p>
  </div>

  <div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead>
          <tr class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">
            <th class="px-8 py-5">Commande</th>
            <th class="px-6 py-5">Date</th>
            <th class="px-6 py-5">Total</th>
            <th class="px-6 py-5">Statut</th>
            <th class="px-8 py-5 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-50">
          <tr *ngFor="let order of orders" class="hover:bg-slate-50/50 transition-colors group">
            <td class="px-8 py-6">
              <div class="flex items-center gap-5">
                <div class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 flex-shrink-0 group-hover:bg-white group-hover:shadow-sm transition-all">
                  <mat-icon class="text-sm">shopping_bag</mat-icon>
                </div>
                <div class="min-w-0">
                  <p class="text-sm font-black text-slate-900 truncate tracking-tight">#{{ order.orderNumber }}</p>
                  <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">{{ order.items.length }} articles</p>
                </div>
              </div>
            </td>
            <td class="px-6 py-6 text-sm text-slate-600 font-medium">
              {{ order.createdAt | date:'longDate' }}
            </td>
            <td class="px-6 py-6 font-black text-slate-900">{{ order.totalPrice | currency:'TND':'DT ':'1.3-3' }}</td>
            <td class="px-6 py-6">
              <select (change)="updateStatus(order.id, $any($event.target).value)" 
                      [class]="getStatusClass(order.status)"
                      class="px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-xl border-none focus:ring-2 focus:ring-green-500 cursor-pointer outline-none shadow-sm">
                <option value="PENDING" [selected]="order.status === 'PENDING'">En attente</option>
                <option value="CONFIRMED" [selected]="order.status === 'CONFIRMED'">Confirmée</option>
                <option value="SHIPPED" [selected]="order.status === 'SHIPPED'">Expédiée</option>
                <option value="DELIVERED" [selected]="order.status === 'DELIVERED'">Livrée</option>
                <option value="CANCELLED" [selected]="order.status === 'CANCELLED'">Annulée</option>
              </select>
            </td>
            <td class="px-8 py-6 text-right">
              <button class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-green-600 hover:bg-green-50 rounded-xl transition-all ml-auto">
                <mat-icon class="text-sm">visibility</mat-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
